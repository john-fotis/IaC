---
name: docker-gitops-deploy

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "ansible/**"
  workflow_dispatch:
    inputs:
      target_env:
        description: "auto runs dmz then prod; or pick one directly"
        type: choice
        default: auto
        options: [auto, dmz, prod]
      dry_run:
        type: boolean
        default: false
      force_deploy:
        type: boolean
        default: false
      verbose:
        type: boolean
        default: false

jobs:
  plan:
    runs-on: self-hosted
    outputs:
      run_dmz: ${{ steps.plan.outputs.run_dmz }}
      run_prod: ${{ steps.plan.outputs.run_prod }}
    steps:
      - id: plan
        run: |
          TARGET="${{ github.event.inputs.target_env }}"
          TARGET="${TARGET:-auto}"
          echo "Resolved target_env: $TARGET (event: ${{ github.event_name }})"
          case "$TARGET" in
            auto) echo "run_dmz=true" >> "$GITHUB_OUTPUT"; echo "run_prod=true" >> "$GITHUB_OUTPUT" ;;
            dmz)  echo "run_dmz=true" >> "$GITHUB_OUTPUT"; echo "run_prod=false" >> "$GITHUB_OUTPUT" ;;
            prod) echo "run_dmz=false" >> "$GITHUB_OUTPUT"; echo "run_prod=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unrecognized target_env: $TARGET" >&2; exit 1 ;;
          esac

  deploy-dmz:
    needs: plan
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.run_dmz == 'true'
    runs-on: self-hosted
    environment: dmz
    concurrency:
      group: docker-gitops-dmz
      cancel-in-progress: false
    steps:
      - name: Deploy dmz
        working-directory: /home/ansible/actions-runner/_work/IaC/ansible
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          FORCE_DEPLOY="${{ github.event.inputs.force_deploy }}"
          VERBOSE="${{ github.event.inputs.verbose }}"
          ansible-playbook -i inventories/docker.ini playbooks/docker-deploy.yml \
            -e "target_env=dmz" \
            -e "dry_run=${DRY_RUN:-false}" \
            -e "force_deploy=${FORCE_DEPLOY:-false}" \
            -e "verbose=${VERBOSE:-false}"

  deploy-prod:
    needs: [plan, deploy-dmz]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.run_prod == 'true' &&
      (needs.deploy-dmz.result == 'success' || needs.deploy-dmz.result == 'skipped')
    runs-on: self-hosted
    environment: prod
    concurrency:
      group: docker-gitops-prod
      cancel-in-progress: false
    steps:
      - name: Deploy prod
        working-directory: /home/ansible/actions-runner/_work/IaC/ansible
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          FORCE_DEPLOY="${{ github.event.inputs.force_deploy }}"
          VERBOSE="${{ github.event.inputs.verbose }}"
          ansible-playbook -i inventories/docker.ini playbooks/docker-deploy.yml \
            -e "target_env=prod" \
            -e "dry_run=${DRY_RUN:-false}" \
            -e "force_deploy=${FORCE_DEPLOY:-false}" \
            -e "verbose=${VERBOSE:-false}"
