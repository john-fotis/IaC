name: docker-gitops-deploy

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "ansible/**"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
      force_deploy:
        type: boolean
        default: false
      verbose:
        type: boolean
        default: false

jobs:
  plan:
    runs-on: self-hosted
    outputs:
      env_matrix: ${{ steps.detect.outputs.env_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Environments from Git Changes
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only \
            ${{ github.event.before || 'HEAD~1' }} \
            ${{ github.sha || 'HEAD' }} | grep -E 'compose\.(yml|yaml)$' || true)
          if [ "${{ inputs.force_deploy }}" == "true" ] || [ -z "$CHANGED_FILES" ]; then
            FILES_TO_SCAN=$(find docker -type f -name '*compose.yml' -o -name '*compose.yaml')
          else
            FILES_TO_SCAN=$CHANGED_FILES
          fi
          if [ -z "$FILES_TO_SCAN" ]; then
            echo 'env_matrix=[]' >> $GITHUB_OUTPUT
            exit 0
          fi

          PROFILES=$(yq eval '.services[].profiles | select(. != null) | .[]' \
            $FILES_TO_SCAN | sort -u | grep -v '---' || true)
          if [ -z "$PROFILES" ]; then
            echo 'env_matrix=[]' >> $GITHUB_OUTPUT
          else
            JSON_ARRAY=$(echo "$PROFILES" | jq -R . | jq -s -c .)
            echo "env_matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: plan
    if: ${{ needs.plan.outputs.env_matrix != '[]' && needs.plan.outputs.env_matrix != '' }}
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.plan.outputs.env_matrix) }}
      fail-fast: false
    environment: ${{ matrix.target }}

    concurrency:
      group: docker-gitops-${{ matrix.target }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Ansible GitOps Deployment
        working-directory: ansible
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE: ${{ inputs.force_deploy || 'false' }}
          VERBOSE: ${{ inputs.verbose || 'false' }}
        run: |
          EXTRA_VARS="-e target_env=${{ matrix.target }} -e dry_run=$DRY_RUN -e force_deploy=$FORCE -e verbose=$VERBOSE"
          echo "Executing for ${{ matrix.target }} with variables: $EXTRA_VARS"
          ansible-playbook -i inventories/docker.ini playbooks/docker-deploy.yml $EXTRA_VARS
