---
name: docker-gitops-deploy

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "ansible/**"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment (auto-detected from git changes, or manually specified)"
        type: choice
        default: auto
        options: [auto, dmz, prod]
      dry_run:
        type: boolean
        default: false
      force_deploy:
        type: boolean
        default: false
      verbose:
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: self-hosted
    concurrency:
      group: docker-gitops-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Ansible GitOps Deployment
        working-directory: ansible
        run: |
          # Build the Ansible command with dynamic parameters based on workflow inputs
          CMD="ansible-playbook -i inventories/docker.ini playbooks/docker-deploy.yml"
          TARGET="${{ github.event.inputs.target_env }}"

          # If triggered by workflow_dispatch AND a specific env is chosen, force the target_env
          # Otherwise, leave target_env undefined for Ansible to detect
          if [ -n "$TARGET" ] && [ "$TARGET" != "auto" ]; then CMD="$CMD -e target_env=$TARGET"; fi

          # Handle other boolean flags (fallback to false for push events where inputs are null)
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          FORCE="${{ github.event.inputs.force_deploy || 'false' }}"
          VERBOSE="${{ github.event.inputs.verbose || 'false' }}"

          # Construct the final command with all parameters
          CMD="$CMD -e dry_run=$DRY_RUN -e force_deploy=$FORCE -e verbose=$VERBOSE"

          echo "Executing: $CMD"
          eval $CMD
