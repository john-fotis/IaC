- name: Deploy Docker Compose block
  when: not dry_run | default(false) | bool
  become: true
  block:
    - name: Pull latest Docker images for the stack
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ docker_dest_dir }}"
      register: docker_compose_pull_result
      changed_when: "'Downloaded newer image' in docker_compose_pull_result.stdout"

    - name: Run Docker Compose to deploy the stack
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ docker_dest_dir }}"
      register: docker_compose_result
      changed_when: "'Starting' in docker_compose_result.stdout or 'Creating' in docker_compose_result.stdout"
    - name: Display Docker Compose output
      ansible.builtin.debug:
        var: docker_compose_result.stdout_lines
      when:
        - docker_compose_result is defined
        - verbose | default(false) | bool
