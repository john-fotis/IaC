---
# roles/docker-gitops/tasks/main.yml

- name: Set compose_profile fact based on target host
  ansible.builtin.set_fact:
    compose_profile: "{{ hostvars[inventory_hostname]['compose_profile'] }}"

- name: "Check if tracked environment file exists for {{ compose_profile }}"
  delegate_to: localhost
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../docker/.{{ compose_profile }}.env"
  register: repo_env_file

- name: "Deploy strict environment file (.{{ compose_profile }}.env) to target server"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker/.{{ compose_profile }}.env"
    dest: "{{ docker_dest_dir }}/.env"
    mode: "0600"
  when: repo_env_file.stat.exists

- name: Override user-related variables in .env file
  ansible.builtin.lineinfile:
    path: "{{ docker_dest_dir }}/.env"
    regexp: "^#?\\s*{{ item.key }}\\s*="
    line: "{{ item.key }}={{ item.value }}"
    state: present
    create: yes
  loop:
    - key: "PUID"
      value: "{{ ansible_uid | default('1001') }}"
    - key: "PGID"
      value: "{{ ansible_gid | default('1001') }}"
    - key: "USERDIR"
      value: "/home/{{ ansible_user | default('ansible') }}"
    - key: "SECRETSDIR"
      value: "/home/{{ ansible_user | default('ansible') }}/docker/secrets/{{ compose_profile }}"

- name: Display pre-flight info
  ansible.builtin.debug:
    msg: >-
      === Starting GitOps Phase 2 Pipeline ===
      Target Host: {{ inventory_hostname }}
      Profile: {{ compose_profile }}
      Dry Run: {{ dry_run | default(false) }}

- name: Deployment and Post-Deployment Tasks
  block:
    - name: Include Docker stack deployment tasks
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/deploy-stack.yml"
      tags: ["gitops-deploy"]

    - name: Include post-deployment controller (Verify, Cleanup, Notify)
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/post-deployment.yml"
      tags: ["gitops-post-deploy"]
  when:
    - not dry_run | default(false) | bool
    - >-
      hostvars['localhost']['sops_decrypt_result'] is not defined
      or not hostvars['localhost']['sops_decrypt_result'].failed | default(false)

- name: Display deployment summary
  ansible.builtin.debug:
    msg: >-
      === Docker GitOps Deployment Summary ===
      Target Host: {{ inventory_hostname }}
      Environment: {{ compose_profile }}
      Git Commit: {{ (hostvars['localhost']['git_current_commit'] | default('N/A'))[:7] }}
      Repository: {{ git_repo_url }}
      Deployment Directory: {{ docker_dest_dir }}
      SOPS Enabled: {{ use_sops | default(false) }}
      Dry Run: {{ dry_run | default(false) }}
      Deployment completed successfully.
  tags: ["always"]
