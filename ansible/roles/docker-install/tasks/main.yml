---
- name: Ensure Docker APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker ASC key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Map Ansible architecture to Debian name
  ansible.builtin.set_fact:
    repo_arch: >-
      {{
        'amd64' if ansible_architecture == 'x86_64' else
        ('arm64' if ansible_architecture == 'aarch64' else ansible_architecture)
      }}

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ repo_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename | lower }} stable
    filename: docker
    state: present
    update_cache: yes

- name: Install Docker CE
  ansible.builtin.apt:
    name: docker-ce
    state: present
    update_cache: true

- name: Configure Docker daemon options
  ansible.builtin.template:
    src: "templates/docker_daemon.json.j2"
    dest: "/etc/docker/daemon.json"
    owner: "root"
    group: "root"
    mode: "0755"
  notify: Restart Docker

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add user to Docker group
  ansible.builtin.user:
    name: "{{ sudo_user }}"
    groups: docker
    append: true
  when: ansible_user != 'root'
