- name: System Maintenance Pipeline
  block:
    - name: Setup bastion automation
      ansible.builtin.include_tasks: bastion-setup.yml
      run_once: true
      tags: ["setup"]

    - name: Maintenance Operations Block
      tags: ["maintenance"]
      block:
        - name: Run system updates
          ansible.builtin.include_tasks: update.yml

        - name: Check reboot status
          ansible.builtin.include_tasks: reboot-check.yml

  always:
    - name: Send aggregated notifications
      ansible.builtin.include_tasks: notify.yml
      run_once: true
      when:
        - enable_notifications | bool
        - discord_webhook_url is defined
        - discord_webhook_url != ""
