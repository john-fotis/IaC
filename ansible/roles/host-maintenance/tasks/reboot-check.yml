---
# roles/host-maintenance/tasks/reboot-check.yml

- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Set reboot required fact
  ansible.builtin.set_fact:
    needs_reboot: "{{ reboot_required_file.stat.exists | default(false) }}"

- name: Trigger Discord notification
  ansible.builtin.include_tasks: notify.yml
  when:
    - needs_reboot | bool
    - enable_notifications | bool
    - discord_webhook_url is defined
    - discord_webhook_url != ""
