---
name: graphite-exporter
services:
  graphite-exporter:
    image: prom/graphite-exporter:v0.16.0
    container_name: graphite-exporter
    profiles: ["prod"]
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik
    volumes:
      - ./config/graphite_mapping.conf:/tmp/graphite_mapping.conf:ro
    restart: unless-stopped
    command:
      - "--graphite.mapping-config=/tmp/graphite_mapping.conf"
