---
services:
  portainer:
    image: portainer/portainer-ee:2.45.2-alpine
    container_name: portainer
    security_opt:
      - no-new-privileges:true
    profiles: ['prod']
    environment:
      - TZ=${TZ}
    networks:
      - traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    command: -H unix:///var/run/docker.sock
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.rule=Host(`portainer.${FQDN}`)
      - traefik.http.routers.portainer.tls=true
      - traefik.http.routers.portainer.service=portainer
      - traefik.http.services.portainer.loadbalancer.server.port=9000
      - traefik.http.routers.portainer.middlewares=chain-no-auth@file

  portainer-agent:
    image: portainer/agent:2.45.2-alpine
    container_name: portainer-agent
    profiles: ['dmz']
    networks:
      - socket_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    # Port forwarding is handled by traefik
    # ports:
    #   - "9001:9001"
    restart: unless-stopped

volumes:
  portainer-data:
    name: portainer-data
    driver: local
