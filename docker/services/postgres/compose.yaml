---
services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    profiles: ["prod", "dmz"]
    container_name: postgres
    environment:
      - POSTGRES_INITDB_ARGS=${POSTGRES_INITDB_ARGS:--data-checksums}
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD:-}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?error}
      - TZ=${TZ:-UTC}
    ports:
      - 5432:5432
    networks:
      - postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "${POSTGRES_USER:-postgres}"']
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 5
    secrets:
      - postgresql_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    profiles: ["prod", "dmz"]
    networks:
      - postgresql
      - traefik
    volumes:
      - $DOCKERDIR/appdata/pgadmin:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_ADMIN_EMAIL:-pgadmin}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_ADMIN_PASSWORD:-error}
    labels:
      - traefik.enable=true
      - traefik.http.routers.pgadmin.rule=Host(`pgadmin.${FQDN}`)
      - traefik.http.routers.pgadmin.entrypoints=websecure
      - traefik.http.routers.pgadmin.tls=true
      - traefik.http.services.pgadmin.loadbalancer.server.port=80
      - traefik.http.routers.pgadmin.middlewares=chain-authentik@file

networks:
  postgresql:
    driver: bridge

volumes:
  postgres-data:
    name: postgres-data
    driver: local
