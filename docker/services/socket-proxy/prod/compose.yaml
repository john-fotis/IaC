---
services:
  # Docker Socket Proxy - Security Enchanced Proxy for Docker Socket
  socket-proxy:
    container_name: socket-proxy
    image: linuxserver/socket-proxy:3.4.7
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles: ['prod']
    networks:
      socket_proxy:
    privileged: false # true for VM. False for unprivileged LXC container.
    ports:
      - '127.0.0.1:2375:2375'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    environment:
      - LOG_LEVEL=info # debug,info,notice,warning,err,crit,alert,emerg
      ## Variables match the URL prefix (i.e. AUTH blocks access to /auth/* parts of the API, etc.).
      ## Granted by Default
      - EVENTS=1
      - PING=1
      - VERSION=1
      ### Security critical - Revoked by Default
      - AUTH=0
      - SECRETS=0
      - POST=0
      # Not always needed
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1 # Required to list containers and read labels/stats (Traefik, Komodo, Beszel)
      - DISTRIBUTION=0
      - EXEC=0 # Komodo "Terminal" will not work
      - IMAGES=1 # Read-only listing (Komodo)
      - INFO=1 # Required to determine container and stack state (Komodo, Beszel)
      - NETWORKS=1 # Read-only listing (Komodo)
      - NODES=0
      - PLUGINS=0
      - SERVICES=1 # Read-only listing (Komodo)
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=1 # Read-only listing (Komodo)
      - VOLUMES=1 # Read-only listing (Komodo)
    read_only: true
    tmpfs:
      - /run
