---
services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:1.13.10
    container_name: speedtest-tracker
    profiles: ["prod"]
    sysctls:
      - net.ipv4.ping_group_range=${PUID:-1000} ${PUID:-1000}
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - DB_CONNECTION=sqlite
      - FILE__APP_KEY=${SPEEDTEST_TRACKER_APP_KEY_FILE}
      - APP_URL=https://speedtest.${FQDN}
      - ASSET_URL=https://speedtest.${FQDN}
      - APP_TIMEZONE=${TZ:-UTC}
      - DISPLAY_TIMEZONE=${TZ:-UTC}
      - SPEEDTEST_SCHEDULE="*/10 * * * *"
      - PRUNE_RESULTS_OLDER_THAN=365
      # - SPEEDTEST_SERVERS=${SPEEDTEST_TRACKER_SERVERS}
      # - DB_HOST=mariadb #optional
      # - DB_PORT=3306 #optional
      # - DB_DATABASE=speedtest #optional
      # - DB_USERNAME=speedtest_user #optional
      # - DB_PASSWORD=ST-DB-PASSWORD-PLACEHOLDER #optional
    volumes:
      - speedtest-tracker:/config
    secrets:
      - speedtest_tracker_app_key
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.speedtest-tracker.entrypoints=websecure
      - traefik.http.routers.speedtest-tracker.tls=true
      - traefik.http.routers.speedtest-tracker.rule=Host(`speedtest.${FQDN}`)
      - traefik.http.routers.speedtest-tracker.tls=true
      - traefik.http.routers.speedtest-tracker.service=speedtest-tracker
      - traefik.http.services.speedtest-tracker.loadbalancer.server.port=80
      - traefik.http.routers.speedtest-tracker.middlewares=chain-no-auth@file

volumes:
  speedtest-tracker:
    name: speedtest-tracker
    driver: local
